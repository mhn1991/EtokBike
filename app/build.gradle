plugins {
    id 'com.android.application'
}

android {
    namespace 'com.etokbike.app'
    compileSdkVersion 25

    defaultConfig {
        applicationId 'com.etokbike.app'
        minSdkVersion 23
        targetSdkVersion 31
        versionCode 1
        versionName '0.1.0'
    }

    lintOptions {
        disable 'GradleCompatible'
    }
}
