plugins {
    id 'com.android.application'
}

android {
    namespace = 'com.etokbike.app'
    compileSdk {
        version = release(36) {
            it.minorApiLevel = 1
        }
    }

    defaultConfig {
        applicationId = 'com.etokbike.app'
        minSdk = 23
        targetSdk = 36
        versionCode = 1
        versionName = '0.1.0'
    }

    lint {
        disable += 'GradleCompatible'
    }
}
